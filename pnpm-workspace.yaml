packages:
  - 'packages/*'
  - 'examples/*'

# pnpm 11 reads these settings only from this file — `.npmrc` is limited to auth and
# registry entries (https://pnpm.io/settings), so the three lines that used to live
# there were inert and the repo ran on pnpm's defaults (issue #177).
#
# Every peer is also a devDependency now, so the packages resolve what they import
# without relying on auto-install; `autoInstallPeers: false` therefore stays honest —
# a peer that is missing gets reported instead of silently installed.
autoInstallPeers: false
strictPeerDependencies: true
allowBuilds:
  '@percy/core': false
  core-js: true
  es5-ext: false
  esbuild: true
  leveldown: false
  mongodb-memory-server: true
  protobufjs: false
  puppeteer: true

overrides:
  # Convention (kept small on purpose):
  # - advisory floors use a caret range, so the next patch inside the same major
  #   is picked up automatically without editing this file again;
  # - exact pins are reserved for things that truly must not drift. The
  #   `prosemirror-model` pin that used to live here was an exact 1.25.11 carried
  #   over from an earlier dedupe pass, and it drifted below the `^1.25.12` the
  #   published manifests declare (issue #262) — an override that holds a package
  #   under its own declared floor, and that made Dependabot's lockfile-only
  #   update a no-op (NoChangeError). It is a caret floor like the others now, so
  #   patches inside 1.25 are picked up while the single-instance guarantee holds.
  prosemirror-model: ^1.25.12
  # Transitive security patches — see issue #165.
  # prosemirror-view < 1.42.3: GHSA-c8x8-7fp4-3x9w (XSS in paste handling).
  prosemirror-view: ^1.42.3
  # markdown-it < 14.3.3: GHSA-gfr2-rv44-r23c (quadratic-time rendering of a
  # multi-line link reference definition); < 14.3.1: GHSA-253c-mchw-3w2r
  # (quadratic linkify path blocks the event loop). `tiptap-markdown@0.9.0` pins
  # 14.3.2 exactly, so the override is the only way to patch that path.
  markdown-it: ^14.3.3
  # source-map-js < 1.2.2: GHSA-68fv-2mgg-jv7q (event-loop DoS via section offsets).
  source-map-js: ^1.2.2
  # Keep a single prosemirror-transform instance. Two copies (1.12.0 + 1.12.2)
  # break brand checks like `step instanceof AddMarkStep` in suggestChanges.ts.
  prosemirror-transform: ^1.12.2

patchedDependencies:
  tiptap-pagination-plus@3.1.0: patches/tiptap-pagination-plus@3.1.0.patch
