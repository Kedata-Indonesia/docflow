packages:
  - 'packages/*'
  - 'examples/*'
allowBuilds:
  '@percy/core': false
  core-js: true
  es5-ext: false
  esbuild: true
  leveldown: false
  mongodb-memory-server: true
  protobufjs: false
  puppeteer: true

overrides:
