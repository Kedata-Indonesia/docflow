version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tiptap:
        patterns:
          - '@tiptap/*'
      prosemirror:
        patterns:
          - 'prosemirror-*'
      yjs:
        patterns:
          - 'y-*'
          - 'yjs'
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - '*'
