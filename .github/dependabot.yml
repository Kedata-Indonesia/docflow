# Dependabot configuration.
#
# Scope: **npm security updates** plus a **weekly GitHub Actions bump**. There is
# deliberately no npm entry under `updates`.
#
# Why the npm version sweep was removed (2026-10-27, after the 2026-10-26 batch
# #423-#428 all went red):
#
# - Dependabot's pnpm updater rewrites the lockfile without deduping, so every
#   bump failed `pnpm dedupe --check` at the first gate — lint, typecheck and the
#   tests never ran — and each pull request needed a manual `pnpm dedupe` plus a
#   push. There is no post-update hook for pnpm, so that repair cannot be
#   automated inside Dependabot.
# - It cannot judge a library's published surface: #425 rewrote core's
#   `y-websocket` range from `^2.0.4 || ^3.1.0` to `^3.1.0`, reverting #283
#   ("support y-websocket 2 and 3"), while labelled `chore(deps)`.
# - Every merge publishes: CI patch-bumps changed packages on each push to `main`.
#
# Security updates are a repository setting, not an entry here — enabled
# 2026-10-19 (Settings -> Code security -> Dependabot security updates). That
# switch stays on and does not need an entry in this file: it opens a fix pull
# request for every alert with an available patch. CI also runs
# `pnpm audit --prod --audit-level=high`, so an advisory does not depend on a bot
# pull request being opened.
#
# If automated version currency is wanted again, use Renovate rather than
# re-adding this block: `postUpdateOptions: ["pnpmDedupe"]` runs the dedupe as
# part of the update, and `rangeStrategy: "widen"` extends a range instead of
# replacing it. Majors then arrive as planned work, which is what they are.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Jakarta"
    labels:
      - "github_actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
