name: Bug report
description: Report a reproducible bug in DocFlow
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please search existing
        issues first to avoid duplicates.
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - '@kedataindo/docflow-core'
        - '@kedataindo/docflow-vue'
        - '@kedataindo/docflow-element'
        - '@kedataindo/docflow-plugins'
        - '@kedataindo/docflow-layout-engine'
        - '@kedataindo/docflow-export'
        - other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. 0.0.85
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Chrome 130, Vue 3.5, Node 22
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
    validations:
      required: false
