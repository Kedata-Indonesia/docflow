name: Feature Request
description: Suggest a feature or enhancement for DocFlow
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! For larger features, consider opening a
        [Discussion](https://github.com/Kedata-Indonesia/docflow/discussions) first.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point, not just the solution
      placeholder: When building X, I can't do Y because ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the API / UI / behavior look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about, including doing it in userland via a custom plugin
  - type: checkboxes
    id: core-principle
    attributes:
      label: Alignment check
      options:
        - label: This belongs in the open-source core (not a hosted/paid service)
          required: true
