name: Feature request
description: Suggest an idea or enhancement for DocFlow
labels: ['enhancement', 'triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you would like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: boundary
    attributes:
      label: Library boundary
      options:
        - label: This feature can be implemented without the library knowing about a backend (via an injection port).
          required: false
