name: Publish to npm

# Publishes the @kedataindo/* packages to the public npm registry.
# GitHub Packages is intentionally NOT used (see docs/operations/PUBLISH.md).
#
# Triggers:
#   - push to `main`     -> verify + auto-bump + build + publish (unattended)
#   - push of a `v*` tag -> same flow without the auto-bump, then a GitHub
#                           Release (generated notes + the demo GIF)
#   - manual run         -> Actions tab (`workflow_dispatch`)
#
# On a push to `main`, scripts/bump-release-versions.mjs patch-bumps everything
# changed since the last `chore(release):` commit (plus their dependents) on the
# current tip of `main`, and the new versions are landed back on `main` as a pull
# request that this workflow opens — and merges when it is allowed to. `main`'s
# ruleset requires the `ci` check and one approving review, so the merge needs a
# human click (or a ruleset bypass actor via RELEASE_TOKEN); when the merge does
# not happen, the PR is left open with a notice instead of failing the run, and
# `docs/operations/PUBLISH.md` documents the follow-up. Publishing itself stays idempotent: a
# version already on npm is skipped, never a hard failure.
# The bump commit deliberately does NOT carry `[skip ci]`: with it, the required
# `ci` check could never report on the bump PR, and only a bypass actor could land
# it — which is what made the old flow depend on a PAT.
#
# The bump is registry-aware: it raises each affected package above everything
# npm already has, so a repo that drifted behind the registry self-heals instead
# of re-bumping into taken versions — which the idempotent publish would skip,
# leaving a green run that ships nothing.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    # A docs-only push publishes nothing (the `release` comment below says as
    # much), yet the run still paid for install + build and, since #433, tried to
    # cut a tag for it. Path filters are not evaluated for tag pushes, so a `v*`
    # release still runs. Anything that touches a package, a script or a workflow
    # is outside this filter and runs as before.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  # `write` is required to push the auto-bump branch and to merge its PR back
  # into `main` (a ruleset on `main` requires every change to go through a pull
  # request, so a direct push is rejected with GH013).
  contents: write
  pull-requests: write
  # `id-token: write` is what lets `npm publish --provenance` sign each package
  # with this workflow's OIDC identity, so a consumer can verify which commit,
  # workflow and run produced the tarball they installed.
  id-token: write

concurrency:
  # Never let two pushes race to publish the same registry packages.
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    # Empty when the push changed no publishable package (docs/scripts-only, or a
    # re-run with nothing left to bump). `release` reads this so it cannot cut a
    # tag for a run that shipped nothing — which is what run 40494893695 did.
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the release bump diffs against the last release commit.
          fetch-depth: 0
          # The write-scoped token must exist only for the final push step.
          persist-credentials: false

      # Publish the CURRENT tip of `main`, not the checkout: a run can start
      # after `main` advanced further, and the concurrency group drops superseded
      # queued runs, so working on a stale sha would leave changes unreleased.
      # Pinned BEFORE install so the gates, build and publish all act on this
      # same revision — never on a newer, unverified tip.
      - name: Pin to the current tip of main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # `origin` is credential-free here (`persist-credentials: false`); the
          # repository is public, so an anonymous fetch is enough.
          git fetch --quiet origin main
          git reset --hard FETCH_HEAD

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          scope: '@kedataindo'

      - run: pnpm install --frozen-lockfile

      # Never publish code that fails its own checks.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Release-script unit tests
        run: pnpm test:scripts

      # The API tables in docs/reference/API.md are generated from the public
      # component contract. A stale table must never reach npm. Regenerate with
      # `pnpm docs:api`.
      - name: Verify generated API docs are up to date
        run: pnpm docs:api:check

      # Never publish packages whose living docs point at moved/missing files.
      - name: Check documentation links
        run: pnpm docs:check

      # Patch-bump every package changed since the last release commit, so `main`
      # ships a fresh version without a manual bump. Versions are raised above
      # whatever npm already has, and an unreachable registry fails this step
      # rather than guessing. No-op on tag pushes.
      - name: Bump versions for changed packages
        id: bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          # Base used only before the first automated release exists.
          BASE_FALLBACK: ${{ github.event.before }}
        run: node scripts/bump-release-versions.mjs auto HEAD

      # Only the publishable packages: `examples/*` must never be able to block
      # a release if its own build breaks.
      - run: pnpm -r --filter "./packages/*" run build

      - name: Publish @kedataindo/* to npm
        run: |
          # `.npmrc` in this repo is TRACKED, so appending the token there leaves
          # the working tree dirty — which made the old commit-back step abort
          # ("cannot pull with rebase: You have unstaged changes") and strand the
          # bump commit, drifting repo versions behind npm (incident: run
          # 37709011366). setup-node already points NPM_CONFIG_USERCONFIG outside
          # the checkout, so write the token there (falling back to npm's default
          # user config).
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          # The leading newline is load-bearing. setup-node v6+ writes this file
          # WITHOUT a trailing newline, so a bare append concatenates the token
          # onto the last line — corrupting `@kedataindo:registry`, which makes
          # every scoped `npm view` fail. The idempotency check below then thinks
          # nothing is published and re-publishes, 403-ing the run (regression:
          # run 38183681839, after the actions were bumped to checkout v7 /
          # setup-node v7 / pnpm-action-setup v6).
          printf '\n//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" >> "$NPMRC"

          # Step 1: Backup package.json and rewrite ALL package.json files (name + deps + workspace:* -> actual version)
          for pkg in core layout-engine plugins vue element export; do
            cp "./packages/$pkg/package.json" "./packages/$pkg/package.json.bak"
            node -e "
              const fs = require('fs');
              const fp = './packages/$pkg/package.json';
              const p = JSON.parse(fs.readFileSync(fp, 'utf8'));
              p.name = '@kedataindo/docflow-$pkg';

              // Rewrite internal dep names AND resolve workspace:* to actual version
              ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies'].forEach(section => {
                if (!p[section]) return;
                Object.keys(p[section]).forEach(k => {
                  if (k.startsWith('@kedata-indonesia/docflow-')) {
                    const sub = k.replace('@kedata-indonesia/docflow-', '');
                    const v = p[section][k];
                    // Resolve workspace:* to the local package's actual version
                    const depPkg = JSON.parse(fs.readFileSync('./packages/' + sub + '/package.json', 'utf8'));
                    const actualVersion = v === 'workspace:*' ? depPkg.version : v;
                    delete p[section][k];
                    p[section]['@kedataindo/docflow-' + sub] = actualVersion;
                  }
                });
              });
              // npm validates `repository.url` against the provenance bundle when
              // publishing with `--provenance`: an empty field rejects the publish
              // with a 422 Failed to validate repository information error (observed
              // on @kedataindo/docflow-export@0.0.13). Declare it on every manifest
              // we publish, together with the usual metadata.
              p.repository = { type: 'git', url: 'git+https://github.com/Kedata-Indonesia/docflow.git' };
              p.homepage = 'https://github.com/Kedata-Indonesia/docflow#readme';
              p.bugs = { url: 'https://github.com/Kedata-Indonesia/docflow/issues' };
              p.publishConfig = { registry: 'https://registry.npmjs.org', access: 'public' };
              fs.writeFileSync(fp, JSON.stringify(p, null, 2) + '\n');
            "
          done

          # Step 2: Rewrite dist files (built JS still has @kedata-indonesia/* hardcoded).
          # Every extension dist can contain is listed: `.css` (vue, element), `.map`
          # (source maps, which carry `sourcesContent`) and `.json` were missing and
          # would have shipped an internal scope unreachable by any other check
          # (issue #173).
          for pkg in core layout-engine plugins vue element export; do
            if [ -d "./packages/$pkg/dist" ]; then
              find "./packages/$pkg/dist" -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' -o -name '*.d.ts' -o -name '*.d.cts' -o -name '*.mts' -o -name '*.css' -o -name '*.map' -o -name '*.json' \) -exec sed -i 's|@kedata-indonesia/docflow-|@kedataindo/docflow-|g' {} +
              echo "Rewrote dist imports for $pkg"
            fi
          done

          # Step 2b: the artefact is what ships, so verify it rather than trusting the
          # sed above. A leftover internal scope is a silent failure — the publish
          # succeeds and the consumer's build breaks later with an error that names
          # nothing recognisable (issue #173). `grep -rl` exits 1 when clean, which is
          # why this runs as the condition of an `if`.
          if leftovers=$(grep -rl '@kedata-indonesia' ./packages/*/dist ./packages/*/package.json 2>/dev/null); then
            echo "::error::published artifact still references @kedata-indonesia:"
            echo "$leftovers"
            exit 1
          fi
          echo "Verified: no internal scope left in any dist"

          # Step 3: Publish in dependency order (idempotent)
          for pkg in core layout-engine plugins vue element export; do
            VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('./packages/$pkg/package.json.bak', 'utf8')).version)")

            if npm view @kedataindo/docflow-$pkg@$VERSION version --registry=https://registry.npmjs.org &>/dev/null 2>&1; then
              # A package the bump just chose must not already exist: that means
              # the bump read a stale registry replica, picked a taken version,
              # and this run would otherwise go green having published nothing.
              # Fail loudly so a re-run (with a fresh read) picks a free version.
              case ",${BUMPED}," in
                *",${pkg},"*)
                  echo "::error::the bump chose @kedataindo/docflow-$pkg@$VERSION, but it is already on npm — stale registry read. Refusing to go green having published nothing; re-run to pick the next free version."
                  exit 1
                  ;;
              esac
              echo "@kedataindo/docflow-$pkg@$VERSION already published, skipping"
            else
              echo "Publishing @kedataindo/docflow-$pkg@$VERSION..."
              # `--provenance` attaches a signed attestation (which repo, commit
              # and workflow built this tarball) from the OIDC token granted by
              # `permissions: id-token: write`.
              pnpm publish --filter @kedataindo/docflow-$pkg --no-git-checks --access public --provenance
            fi
          done

          # Step 4: Restore package.json from backup
          for pkg in core layout-engine plugins vue element export; do
            mv "./packages/$pkg/package.json.bak" "./packages/$pkg/package.json"
          done
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          BUMPED: ${{ steps.bump.outputs.bumped }}

      # The bump only ever picks a version npm does not have, so a version that
      # is still missing here means the publish did not actually land. `npm
      # view` reads through npm's CDN and read replicas, which can lag several
      # minutes behind an accepted publish (observed: 1.5-7 min for this
      # scope), so poll with a bounded budget instead of a handful of retries.
      - name: Verify the bumped versions are live on npm
        if: steps.bump.outputs.bumped != ''
        env:
          VERIFY_TIMEOUT_SECONDS: "900"
          VERIFY_POLL_SECONDS: "20"
        run: |
          deadline=$((SECONDS + VERIFY_TIMEOUT_SECONDS))
          for pkg in $(echo "${{ steps.bump.outputs.bumped }}" | tr ',' ' '); do
            version=$(node -e "console.log(require('./packages/${pkg}/package.json').version)")
            while :; do
              # `timeout` bounds each read: a stalled registry must not stretch
              # the budget (it then just counts as "not visible yet").
              if timeout 60 npm view "@kedataindo/docflow-${pkg}@${version}" version \
                --registry=https://registry.npmjs.org >/dev/null 2>&1; then
                echo "@kedataindo/docflow-${pkg}@${version} is live"
                break
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::@kedataindo/docflow-${pkg}@${version} was not published"
                exit 1
              fi
              echo "@kedataindo/docflow-${pkg}@${version} not visible yet, waiting..."
              sleep "$VERIFY_POLL_SECONDS"
            done
          done

      # Keep the repo in sync with what was just published: the publish step
      # restores each package.json from its `.bak`, which already carries the
      # bumped version. `main` is protected by a ruleset that routes every change
      # through a pull request — a direct push is rejected with GH013 and the bump
      # is stranded (incident: run 37713844249), so the bump is pushed to a
      # throwaway branch and opened as a PR by this step itself.
      #
      # That ruleset requires the `ci` check and one approving review. A bot PR
      # cannot approve itself, and a commit carrying `[skip ci]` would keep `ci`
      # from ever reporting — the combination is why this used to depend on a PAT
      # owned by a ruleset bypass actor. The bump commit therefore carries no
      # `[skip ci]`: `ci` runs and reports like on any other PR, and the review is
      # the only thing left. With a `RELEASE_TOKEN` (PAT of a bypass actor) this
      # step merges the PR itself and nobody has to click; without one the PR is
      # left open with a notice instead of a failed run, because "waiting for a
      # review" is not an automation failure.
      - name: Land version bumps on main via PR
        if: steps.bump.outputs.bumped != ''
        env:
          # Injected here only — checkout sets `persist-credentials: false`, so
          # install/build never hold a repo-write token.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          BUMPED: ${{ steps.bump.outputs.bumped }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # GITHUB_RUN_ID is stable across "Re-run jobs" and a failed run leaves
          # its branch behind, which would reject the next push (non-fast-forward)
          # before the PR is even opened — the attempt number keeps re-runs clear.
          BRANCH="release/bump-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json

          if git diff --cached --quiet; then
            echo "No version changes to commit."
            exit 0
          fi

          git checkout -b "$BRANCH"
          # Deliberately no `[skip ci]`: a skipped commit leaves the required `ci`
          # check unreported on the bump PR, so a human lander would face a check
          # that can never go green. It is not what makes the landing work, though
          # — `RELEASE_TOKEN` is: the merges below use a bypass actor's token and
          # typically land seconds after the PR opens, before `ci` reports.
          git commit -m "chore(release): bump ${BUMPED}"

          # The bump commit above is the only tree change that must reach main;
          # anything else is an ephemeral side effect of the build/publish steps.
          git reset --hard HEAD
          git push "$REMOTE" "HEAD:refs/heads/${BRANCH}"

          cat > "$RUNNER_TEMP/bump-pr-body.md" <<EOF
          Automated release commit for \`${BUMPED}\`.

          Produced by the push-to-main publish workflow
          (\`.github/workflows/publish.yml\`). The versions above are **already on
          npm**; \`main\` routes every change through a pull request, so merging this
          one is what restores parity between the repository and the registry.

          Merging is what restores parity, and the publish workflow does it itself
          when the repository secret \`RELEASE_TOKEN\` is set — a PAT that is a
          ruleset bypass actor — usually seconds after this PR opens, before \`ci\`
          here reports. Without that secret the run stays green and waits for a
          maintainer. Either way, until this lands, npm is ahead of \`main\` — see
          \`docs/operations/PUBLISH.md\` → "Landing the bump".
          EOF

          # A human merge can land while this run publishes (the concurrency group
          # only serialises workflow runs) and GitHub can take a moment to report a
          # brand-new PR as mergeable, so retry — then verify the commit is really
          # on main instead of trusting the exit code.
          PR=""
          for attempt in 1 2 3 4 5 6; do
            if [ -z "$PR" ]; then
              PR=$(gh pr list --head "$BRANCH" --state open --json url \
                --jq '.[0].url // ""' 2>/dev/null || echo "")
            fi
            if [ -z "$PR" ]; then
              PR=$(gh pr create --base main --head "$BRANCH" \
                --title "chore(release): bump ${BUMPED}" \
                --body-file "$RUNNER_TEMP/bump-pr-body.md" | tail -n 1) || PR=""
            fi
            if [ -n "$PR" ]; then
              if gh pr merge "$PR" --merge; then
                break
              fi
              # Ask GitHub to land it as soon as the review arrives. Best effort:
              # repository auto-merge has to be enabled, and with a RELEASE_TOKEN
              # the direct merge above already succeeded.
              gh pr merge "$PR" --merge --auto >/dev/null 2>&1 || true
            fi
            # Drop our handle so the next attempt re-lists (or re-creates) the PR:
            # the one we held may have been closed without being merged.
            PR=""
            if [ "$attempt" -lt 6 ]; then
              echo "Attempt ${attempt} could not land the bump PR; retrying..."
              sleep 10
            fi
          done

          # The bump must not silently stay behind the registry — but "waiting for
          # a maintainer's review" is not an automation failure either. Separate
          # the two outcomes instead of turning both into a red run.
          git fetch --quiet "$REMOTE" main
          if git merge-base --is-ancestor HEAD FETCH_HEAD; then
            # Disposable once merged.
            git push "$REMOTE" --delete "$BRANCH" || true
            exit 0
          fi

          OPEN_PR=$(gh pr list --head "$BRANCH" --state open --json url \
            --jq '.[0].url // ""' 2>/dev/null || echo "")
          if [ -z "$OPEN_PR" ]; then
            echo "::error::the bump commit did not reach main and no open PR carries it (branch ${BRANCH}) — the automation itself failed, and main has drifted behind npm. See docs/operations/PUBLISH.md."
            exit 1
          fi

          {
            echo "### Release bump is waiting for review"
            echo
            echo "npm already serves the versions this run published; main gets them when ${OPEN_PR} is merged (one click)."
            echo
            echo "The run is green on purpose: waiting for a review is a normal state, not an automation failure."
            echo "A RELEASE_TOKEN secret (PAT owned by a ruleset bypass actor) lets this step merge the bump unattended."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Release bump awaiting review::${OPEN_PR} — npm is ahead of main until it is merged (docs/operations/PUBLISH.md)."
          exit 0

  # Announce what the publish job just shipped. A `v*` tag keeps its own
  # name. A push to `main` gets a date tag (`vYYYY.MM.DD.N`) on the published
  # commit — never on a moving branch tip — so the Releases page tracks npm
  # instead of stopping at the last hand-cut tag (v0.0.90 covered 100+ published
  # versions). Docs-only pushes publish nothing and announce nothing.
  # Notes are grouped by label in `.github/release.yml`; the demo GIF is
  # attached (docs/operations/RELEASING.md).
  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.publish.outputs.bumped != '')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub Release
        env:
          # `contents: write` lets this token push the date tag and cut the Release.
          GH_TOKEN: ${{ github.token }}
          # `git tag -a` creates an annotated tag object, which needs a committer
          # identity — the checkout has none (run 40494893695 died with
          # "Committer identity unknown", exit 128). Env vars keep it scoped to
          # this step instead of writing global git config on the runner.
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            # The publish job pins itself to the tip it actually shipped. A later
            # push can move `main` while this job is queued, so announce that pin
            # — not whatever `main` points at now.
            git fetch --quiet origin "${GITHUB_SHA}"
            git checkout --detach "${GITHUB_SHA}"
            DATE=$(TZ=Asia/Jakarta date +%Y.%m.%d)
            N=1
            TAG="v${DATE}.${N}"
            while git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null \
              || gh release view "$TAG" >/dev/null 2>&1; do
              N=$((N + 1))
              TAG="v${DATE}.${N}"
            done
            # An annotated tag on the published commit, not on a branch tip.
            git tag -a "$TAG" -m "DocFlow ${TAG}"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "refs/tags/${TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          # A re-run (or a retried publish) must never fail on an announced tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi

          # The GitHub API prepends this body to the automatically generated notes.
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          DocFlow **$TAG** — published to npm as \`@kedataindo/docflow-*\`.

          Human-written history: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md).
          EOF

          # Attach the demo GIF when the tagged tree carries it; older tags may
          # predate the asset, which must not break the release.
          assets=()
          if [ -f docs/assets/docflow-demo.gif ]; then
            assets+=('docs/assets/docflow-demo.gif#Demo GIF')
          fi

          # `--verify-tag` refuses to invent a tag: the release must describe an
          # already-pushed ref, never a tag created from a moving branch tip.
          gh release create "$TAG" \
            --title "DocFlow $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --generate-notes \
            --verify-tag \
            ${assets[@]+"${assets[@]}"}
