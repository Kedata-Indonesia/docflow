name: Publish to npm

# Publishes the @kedataindo/* packages to the public npm registry.
# GitHub Packages is intentionally NOT used (see docs/PUBLISH.md).
#
# Triggers:
#   - push to `main`     -> verify + auto-bump + build + publish (unattended)
#   - push of a `v*` tag -> same flow, without the auto-bump
#   - manual run         -> Actions tab (`workflow_dispatch`)
#
# On a push to `main`, scripts/bump-release-versions.mjs patch-bumps everything
# changed since the last `chore(release):` commit (plus their dependents) on the
# current tip of `main`, and the new versions are committed back, so merging is
# all it takes to release. Publishing itself stays idempotent: a version already
# on npm is skipped, never a hard failure.
#
# The bump is registry-aware: it raises each affected package above everything
# npm already has, so a repo that drifted behind the registry self-heals instead
# of re-bumping into taken versions — which the idempotent publish would skip,
# leaving a green run that ships nothing.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  # `write` is required to commit the auto-bumped versions back to `main`.
  contents: write

concurrency:
  # Never let two pushes race to publish the same registry packages.
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the release bump diffs against the last release commit.
          fetch-depth: 0
          # The write-scoped token must exist only for the final push step.
          persist-credentials: false

      # Publish the CURRENT tip of `main`, not the checkout: a run can start
      # after `main` advanced further, and the concurrency group drops superseded
      # queued runs, so working on a stale sha would leave changes unreleased.
      # Pinned BEFORE install so the gates, build and publish all act on this
      # same revision — never on a newer, unverified tip.
      - name: Pin to the current tip of main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # `origin` is credential-free here (`persist-credentials: false`); the
          # repository is public, so an anonymous fetch is enough.
          git fetch --quiet origin main
          git reset --hard FETCH_HEAD

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          scope: '@kedataindo'

      - run: pnpm install --frozen-lockfile

      # Never publish code that fails its own checks.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Release-script unit tests
        run: pnpm test:scripts

      # The README API tables are generated from the public component contract;
      # a stale README must never reach npm. Regenerate with `pnpm docs:api`.
      - name: Verify generated API docs are up to date
        run: pnpm docs:api:check

      # Patch-bump every package changed since the last release commit, so `main`
      # ships a fresh version without a manual bump. Versions are raised above
      # whatever npm already has, and an unreachable registry fails this step
      # rather than guessing. No-op on tag pushes.
      - name: Bump versions for changed packages
        id: bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          # Base used only before the first automated release exists.
          BASE_FALLBACK: ${{ github.event.before }}
        run: node scripts/bump-release-versions.mjs auto HEAD

      # Only the publishable packages: `examples/*` must never be able to block
      # a release if its own build breaks.
      - run: pnpm -r --filter "./packages/*" run build

      - name: Publish @kedataindo/* to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc

          # Step 1: Backup package.json and rewrite ALL package.json files (name + deps + workspace:* -> actual version)
          for pkg in core layout-engine plugins vue element export; do
            cp "./packages/$pkg/package.json" "./packages/$pkg/package.json.bak"
            node -e "
              const fs = require('fs');
              const fp = './packages/$pkg/package.json';
              const p = JSON.parse(fs.readFileSync(fp, 'utf8'));
              p.name = '@kedataindo/docflow-$pkg';

              // Rewrite internal dep names AND resolve workspace:* to actual version
              ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies'].forEach(section => {
                if (!p[section]) return;
                Object.keys(p[section]).forEach(k => {
                  if (k.startsWith('@kedata-indonesia/docflow-')) {
                    const sub = k.replace('@kedata-indonesia/docflow-', '');
                    const v = p[section][k];
                    // Resolve workspace:* to the local package's actual version
                    const depPkg = JSON.parse(fs.readFileSync('./packages/' + sub + '/package.json', 'utf8'));
                    const actualVersion = v === 'workspace:*' ? depPkg.version : v;
                    delete p[section][k];
                    p[section]['@kedataindo/docflow-' + sub] = actualVersion;
                  }
                });
              });
              p.publishConfig = { registry: 'https://registry.npmjs.org', access: 'public' };
              fs.writeFileSync(fp, JSON.stringify(p, null, 2) + '\n');
            "
          done

          # Step 2: Rewrite dist files (built JS still has @kedata-indonesia/* hardcoded)
          for pkg in core layout-engine plugins vue element export; do
            if [ -d "./packages/$pkg/dist" ]; then
              find "./packages/$pkg/dist" -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' -o -name '*.d.ts' -o -name '*.d.cts' -o -name '*.mts' \) -exec sed -i 's|@kedata-indonesia/docflow-|@kedataindo/docflow-|g' {} +
              echo "Rewrote dist imports for $pkg"
            fi
          done

          # Step 3: Publish in dependency order (idempotent)
          for pkg in core layout-engine plugins vue element export; do
            VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('./packages/$pkg/package.json.bak', 'utf8')).version)")

            if npm view @kedataindo/docflow-$pkg@$VERSION version --registry=https://registry.npmjs.org &>/dev/null 2>&1; then
              echo "@kedataindo/docflow-$pkg@$VERSION already published, skipping"
            else
              echo "Publishing @kedataindo/docflow-$pkg@$VERSION..."
              pnpm publish --filter @kedataindo/docflow-$pkg --no-git-checks --access public
            fi
          done

          # Step 4: Restore package.json from backup
          for pkg in core layout-engine plugins vue element export; do
            mv "./packages/$pkg/package.json.bak" "./packages/$pkg/package.json"
          done
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The bump only ever picks a version npm does not have, so a version that
      # is still missing here means the publish did not actually land. Retry a
      # few times first: `npm view` can lag behind a successful publish.
      - name: Verify the bumped versions are live on npm
        if: steps.bump.outputs.bumped != ''
        run: |
          for pkg in $(echo "${{ steps.bump.outputs.bumped }}" | tr ',' ' '); do
            version=$(node -e "console.log(require('./packages/${pkg}/package.json').version)")
            live=""
            for attempt in 1 2 3 4 5; do
              if npm view "@kedataindo/docflow-${pkg}@${version}" version \
                --registry=https://registry.npmjs.org >/dev/null 2>&1; then
                live="yes"
                break
              fi
              echo "attempt $attempt: @kedataindo/docflow-${pkg}@${version} not visible yet"
              sleep 5
            done
            if [ -z "$live" ]; then
              echo "::error::@kedataindo/docflow-${pkg}@${version} was not published"
              exit 1
            fi
            echo "@kedataindo/docflow-${pkg}@${version} is live"
          done

      # Keep the repo in sync with what was just published: the publish step
      # restores each package.json from its `.bak`, which already carries the
      # bumped version. Pushed with GITHUB_TOKEN, so it cannot re-trigger this
      # workflow (`[skip ci]` documents that intent).
      - name: Commit version bumps to main
        if: steps.bump.outputs.bumped != ''
        env:
          # Injected here only — checkout sets `persist-credentials: false`, so
          # install/build never hold a repo-write token.
          GH_TOKEN: ${{ github.token }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json

          if git diff --cached --quiet; then
            echo "No version changes to commit."
            exit 0
          fi

          git commit -m "chore(release): bump ${{ steps.bump.outputs.bumped }} [skip ci]"

          # A human push can land while this run publishes (the concurrency group
          # only serialises workflow runs). Rebase and retry, then verify.
          for attempt in 1 2 3; do
            if git pull --rebase "$REMOTE" main && git push "$REMOTE" HEAD:main; then
              break
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt ${attempt} could not land the bump; retrying..."
              sleep 5
            fi
          done

          # Never stay green while the repo drifts behind npm.
          git fetch --quiet "$REMOTE" main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::version bump did not reach main — repo and npm may drift"
            exit 1
          fi
