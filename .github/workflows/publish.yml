name: Publish to GitHub Packages

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kedata-indonesia'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Publish core
        run: pnpm publish --filter @kedata-indonesia/docflow-core --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish layout-engine
        run: pnpm publish --filter @kedata-indonesia/docflow-layout-engine --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish plugins
        run: pnpm publish --filter @kedata-indonesia/docflow-plugins --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish vue
        run: pnpm publish --filter @kedata-indonesia/docflow-vue --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish element
        run: pnpm publish --filter @kedata-indonesia/docflow-element --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
