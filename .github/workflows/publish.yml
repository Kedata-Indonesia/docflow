name: Publish to GitHub Packages & npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kedata-indonesia'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Publish core (idempotent)
        run: |
          VERSION=$(node -e "console.log(require('./packages/core/package.json').version)")
          if npm view @kedata-indonesia/docflow-core@$VERSION version &>/dev/null 2>&1; then
            echo "@kedata-indonesia/docflow-core@$VERSION already published, skipping"
          else
            echo "Publishing @kedata-indonesia/docflow-core@$VERSION..."
            pnpm publish --filter @kedata-indonesia/docflow-core --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish layout-engine (idempotent)
        run: |
          VERSION=$(node -e "console.log(require('./packages/layout-engine/package.json').version)")
          if npm view @kedata-indonesia/docflow-layout-engine@$VERSION version &>/dev/null 2>&1; then
            echo "@kedata-indonesia/docflow-layout-engine@$VERSION already published, skipping"
          else
            echo "Publishing @kedata-indonesia/docflow-layout-engine@$VERSION..."
            pnpm publish --filter @kedata-indonesia/docflow-layout-engine --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish plugins (idempotent)
        run: |
          VERSION=$(node -e "console.log(require('./packages/plugins/package.json').version)")
          if npm view @kedata-indonesia/docflow-plugins@$VERSION version &>/dev/null 2>&1; then
            echo "@kedata-indonesia/docflow-plugins@$VERSION already published, skipping"
          else
            echo "Publishing @kedata-indonesia/docflow-plugins@$VERSION..."
            pnpm publish --filter @kedata-indonesia/docflow-plugins --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish vue (idempotent)
        run: |
          VERSION=$(node -e "console.log(require('./packages/vue/package.json').version)")
          if npm view @kedata-indonesia/docflow-vue@$VERSION version &>/dev/null 2>&1; then
            echo "@kedata-indonesia/docflow-vue@$VERSION already published, skipping"
          else
            echo "Publishing @kedata-indonesia/docflow-vue@$VERSION..."
            pnpm publish --filter @kedata-indonesia/docflow-vue --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish element (idempotent)
        run: |
          VERSION=$(node -e "console.log(require('./packages/element/package.json').version)")
          if npm view @kedata-indonesia/docflow-element@$VERSION version &>/dev/null 2>&1; then
            echo "@kedata-indonesia/docflow-element@$VERSION already published, skipping"
          else
            echo "Publishing @kedata-indonesia/docflow-element@$VERSION..."
            pnpm publish --filter @kedata-indonesia/docflow-element --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─── Public npm (@kedataindo/*) ───────────────────────────
      - name: Publish @kedataindo/* to public npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc

          # Step 1: Rewrite ALL package.json files (name + deps + workspace:* → actual version)
          # Dependency order: core → layout-engine → plugins → vue → element
          for pkg in core layout-engine plugins vue element; do
            node -e "
              const fs = require('fs');
              const fp = './packages/$pkg/package.json';
              const p = JSON.parse(fs.readFileSync(fp, 'utf8'));
              p.name = '@kedataindo/docflow-$pkg';

              // Rewrite internal dep names AND resolve workspace:* to actual version
              ['dependencies', 'devDependencies', 'peerDependencies'].forEach(section => {
                if (!p[section]) return;
                Object.keys(p[section]).forEach(k => {
                  if (k.startsWith('@kedata-indonesia/docflow-')) {
                    const sub = k.replace('@kedata-indonesia/docflow-', '');
                    const v = p[section][k];
                    // Resolve workspace:* to the local package's actual version
                    const depPkg = JSON.parse(fs.readFileSync('./packages/' + sub + '/package.json', 'utf8'));
                    const actualVersion = v === 'workspace:*' ? depPkg.version : v;
                    delete p[section][k];
                    p[section]['@kedataindo/docflow-' + sub] = actualVersion;
                  }
                });
              });
              p.publishConfig = { registry: 'https://registry.npmjs.org', access: 'public' };
              fs.writeFileSync(fp, JSON.stringify(p, null, 2) + '\n');
            "
          done

          # Step 2: Publish in dependency order
          for pkg in core layout-engine plugins vue element; do
            VERSION=$(node -e "console.log(require('./packages/$pkg/package.json').version)")

            if npm view @kedataindo/docflow-$pkg@\$VERSION version &>/dev/null 2>&1; then
              echo "@kedataindo/docflow-$pkg@\$VERSION already published, skipping"
            else
              echo "Publishing @kedataindo/docflow-$pkg@\$VERSION..."
              pnpm publish --filter @kedataindo/docflow-$pkg --no-git-checks --access public
            fi
          done

          # Step 3: Restore all original package.json
          for pkg in core layout-engine plugins vue element; do
            git checkout HEAD -- packages/$pkg/package.json
          done
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
