name: CI

# Runs the same gates the release pipeline runs, but on the pull request — so a
# change is verified *before* it can merge, not only after it lands on `main`.
# The `ci` job below is the required status check on `main`.
#
# `pull_request` (never `pull_request_target`): no secrets and no base-repo write
# token are exposed to PR code. Fork PRs run with a read-only token, which is all
# lint/typecheck/tests/build need.
on:
  pull_request:
    branches: [main]

# A PR's earlier runs are irrelevant once it is pushed to again.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job id is the required-check context; keep it `ci`.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A split same-major dependency once broke `instanceof` checks (#165).
      # Exit 0 means "no fixable duplicates left", not "zero duplicates": the
      # lockfile keeps ~31 same-major groups (mostly esbuild) on purpose.
      - name: Lockfile has no fixable duplicate instances
        run: pnpm dedupe --check

      # Never let a change that fails its own checks reach `main`.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test:coverage

      # Thresholds fail the run; the table still lands in the job summary.
      - name: Coverage summary
        if: always()
        run: pnpm coverage:summary

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: packages/*/coverage/coverage-summary.json
          retention-days: 7

      - name: Release-script unit tests
        run: pnpm test:scripts

      # The README API tables are generated from the public component contract.
      - name: Verify generated API docs are up to date
        run: pnpm docs:api:check

      # Living docs must not point at files that no longer exist (moved pages,
      # renamed sources). Historical plans are excluded — see docs/plans/README.md.
      - name: Check documentation links
        run: pnpm docs:check

      # Only the publishable packages: `examples/*` must not be able to block CI.
      - name: Build packages
        run: pnpm -r --filter "./packages/*" run build

  # E2E covers what unit tests cannot see: pagination, page breaks, table
  # resize and keymap ordering. It runs after `ci` so a failing gate doesn't
  # pay for a browser download; skipped when `ci` fails.
  e2e:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright (Chromium)
        run: pnpm exec playwright install --with-deps chromium

      # The playground loads `dist`, so the packages must be built first.
      - name: Build packages and playground
        run: pnpm build

      - name: E2E (showcase)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
